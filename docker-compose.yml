# XITE backend — API + database.
#
# Owns the schema: this is the only service that runs `prisma migrate deploy`.
# The frontend (kishore7ga-art/xite-F) must not, or two containers race the
# same database and a migration lands half applied.

services:
  api:
    build:
      context: .
    restart: unless-stopped
    # Not published to the host. Dokploy's Traefik reaches it over the Docker
    # network — set the port to 4000 in the Domains tab.
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://collegeadmin:${POSTGRES_PASSWORD}@db:5432/college_saas?schema=public}
      SESSION_SECRET: ${SESSION_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Exact origins, never "*": the session cookie rides on these requests and
      # browsers refuse a wildcard alongside credentials.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://xite.co.in}
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - uploads:/app/public/uploads
    # Uncomment to share Dokploy's network with a frontend deployed separately.
    # networks:
    #   - dokploy-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collegeadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: college_saas
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collegeadmin -d college_saas"]
      interval: 5s
      timeout: 5s
      retries: 12

# networks:
#   dokploy-network:
#     external: true

volumes:
  db_data:
  uploads:

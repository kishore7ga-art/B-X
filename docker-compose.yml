# XITE backend — Express API Service with MongoDB Mongoose persistence.

services:
  api:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-}
      MONGODB_URI: ${MONGODB_URI:-}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://xite.co.in,https://admin.xite.co.in,https://api.xite.co.in,http://localhost:3000,http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - uploads:/app/public/uploads
    networks:
      dokploy-network:
        aliases:
          - xite-api

networks:
  dokploy-network:
    external: true

volumes:
  uploads:
